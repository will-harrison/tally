<style>
:root{
  --bg:#f7f8fa; --panel:#ffffff; --text:#1f2a37; --muted:#6b7583; --faint:#9aa3ae; --line:#e2e5ea;
  --navy:#1d3a5a; --link:#2a6fb0; --green:#4c8a1a; --hero:#cdd5ea; --hero-ink:#1d3a5a; --hero-field:#ffffff;
  --ramp-lo:#eceef5; --ramp-hi:#1f5f8f; --cell-ink:#1f2a37; --danger:#b4462f;
  --display:"Montserrat",system-ui,-apple-system,"Segoe UI",sans-serif;
  --body:"Roboto",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --mono:"Inconsolata",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--text);font:400 14px/1.5 var(--body);-webkit-font-smoothing:antialiased}
a,button.link{color:var(--link);text-decoration:none;background:none;border:0;padding:0;font:inherit;cursor:pointer}
a:hover,button.link:hover{text-decoration:underline;text-underline-offset:3px}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--link);outline-offset:2px}
.wrap{max-width:1000px;margin:0 auto;padding:18px 16px 32px}

header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:2px 0 16px}
.mark{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:7px;background:var(--navy);
  color:#fff;font:800 19px/1 var(--display)}
.word{font:800 25px/1 var(--display);color:var(--navy);letter-spacing:-.6px}
.word i{font-style:normal;font-weight:300}
.tag{font:400 13px var(--body);color:var(--muted);padding-top:3px}
header .spacer{flex:1}
#status{font:500 13px var(--mono);color:var(--muted);background:var(--panel);border:1px solid var(--line);padding:3px 9px;border-radius:999px}

/* hero input */
.hero{background:var(--hero);color:var(--hero-ink);padding:22px 20px 16px;margin-bottom:14px;border-radius:10px}
.hero h1{margin:0 0 14px;font:300 clamp(26px,5.5vw,40px)/1.08 var(--display);letter-spacing:-1px}
