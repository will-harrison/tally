<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>daily.tally</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.75.0/dist/umd/supabase.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inconsolata:wght@400;500;600&family=Montserrat:wght@300;400;600;700;800&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f8fa; --panel:#ffffff; --text:#1f2a37; --muted:#6b7583; --faint:#9aa3ae; --line:#e2e5ea;
  --navy:#1d3a5a; --link:#2a6fb0; --green:#4c8a1a; --hero:#cdd5ea; --hero-ink:#1d3a5a; --hero-field:#ffffff;
  --ramp-lo:#eceef5; --ramp-hi:#1f5f8f; --cell-ink:#1f2a37; --danger:#b4462f;
  --display:"Montserrat",system-ui,-apple-system,"Segoe UI",sans-serif;
  --body:"Roboto",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --mono:"Inconsolata",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--text);font:400 14px/1.5 var(--body);-webkit-font-smoothing:antialiased}
a,button.link{color:var(--link);text-decoration:none;background:none;border:0;padding:0;font:inherit;cursor:pointer}
a:hover,button.link:hover{text-decoration:underline;text-underline-offset:3px}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--link);outline-offset:2px}
.wrap{max-width:1000px;margin:0 auto;padding:18px 16px 32px}

header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:2px 0 16px}
.mark{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:7px;background:var(--navy);
  color:#fff;font:800 19px/1 var(--display)}
.word{font:800 25px/1 var(--display);color:var(--navy);letter-spacing:-.6px}
.word i{font-style:normal;font-weight:300}
.tag{font:400 13px var(--body);color:var(--muted);padding-top:3px}
header .spacer{flex:1}
#status{font:500 13px var(--mono);color:var(--muted);background:var(--panel);border:1px solid var(--line);padding:3px 9px;border-radius:999px}

/* hero input */
.hero{background:var(--hero);color:var(--hero-ink);padding:22px 20px 16px;margin-bottom:14px;border-radius:10px}
.hero h1{margin:0 0 14px;font:300 clamp(26px,5.5vw,40px)/1.08 var(--display);letter-spacing:-1px}
.entry{display:flex;gap:8px}
#text{flex:1;min-width:0;font:400 19px/1.2 var(--body);color:var(--text);background:var(--hero-field);
  border:1px solid transparent;padding:12px 14px;border-radius:7px;box-shadow:inset 0 0 0 1px rgba(29,58,90,.08)}
#text::placeholder{color:var(--faint)}
#text:focus{outline:none;border-color:var(--link)}
.hbtn{border:0;background:var(--navy);color:#fff;font:600 15px var(--display);padding:0 18px;border-radius:7px;cursor:pointer;min-width:52px}
.hbtn:hover{background:#264b73}
#mic{background:var(--hero-field);color:var(--navy);box-shadow:inset 0 0 0 1px rgba(29,58,90,.15)}
#mic svg{width:20px;height:20px;vertical-align:middle}
#mic.on{background:#c0392b;color:#fff;box-shadow:none}
#feedback{min-height:22px;margin-top:11px;font-size:14px}
#feedback .chip{display:inline-block;background:rgba(255,255,255,.7);padding:2px 9px;margin:2px 4px 2px 0;border-radius:999px;font:500 14px var(--mono)}
#feedback .link{color:var(--navy);text-decoration:underline;text-underline-offset:3px}

/* toolbar: views (blue), time (green), search */
.toolbar{background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-bottom:14px}
.strip{font-size:14px;color:var(--muted);padding:10px 16px;white-space:nowrap;overflow-x:auto;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.strip+.strip{border-top:1px solid var(--line)}
.strip .sep{margin:0 8px;color:var(--faint);font-family:var(--mono)}
.strip .lbl{color:var(--muted)}
#views{font-family:var(--display);font-weight:600;font-size:14px}
#views .cur{color:var(--text);box-shadow:inset 0 -2px 0 var(--link);padding-bottom:3px}
.time button.link{color:var(--green);font-weight:500}
.time .cur{color:var(--text);font-family:var(--mono);font-weight:600;font-size:15px}
.time .now{color:var(--text);font-weight:500}
.searchrow{display:flex;align-items:center;gap:10px;padding:9px 16px;border-top:1px solid var(--line)}
.searchrow label{font:600 13px var(--display);color:var(--muted)}
#search{border:1px solid var(--line);background:var(--bg);color:var(--text);font:400 14px var(--body);padding:6px 10px;border-radius:6px;width:240px;max-width:100%}

#view{border:1px solid var(--line);background:var(--panel);min-height:340px;position:relative;border-radius:10px;overflow:hidden}
#view svg{font-family:var(--body)}
#view .tick text,.cal svg text{font-family:var(--mono)}
.empty{padding:56px 24px;color:var(--muted);text-align:center;font-size:15px}
.empty strong{display:block;color:var(--text);font:600 18px var(--display);margin-bottom:6px}

/* today */
.row{display:grid;grid-template-columns:1fr auto 132px;gap:16px;align-items:center;padding:13px 18px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .name{font:600 16px var(--display);letter-spacing:-.2px}
.row .notes{font-size:13px;color:var(--muted);margin-top:3px}
.row .total{font:500 24px/1 var(--mono);text-align:right;white-space:nowrap;color:var(--navy)}
.row svg{display:block}
@media (max-width:560px){.row{grid-template-columns:1fr auto;padding:12px 14px}.row .spark{display:none}.row .total{font-size:21px}}

/* calendar */
.cals{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:22px;padding:18px}
.cal h3{margin:0 0 6px;font:600 14px var(--display);display:flex;justify-content:space-between;gap:8px}
.cal h3 span{color:var(--muted);font:500 13px var(--mono)}
.cal .dow{display:grid;grid-template-columns:repeat(7,1fr);font:500 11px var(--mono);color:var(--faint);text-align:center;margin-bottom:2px}
.cal svg{display:block;width:100%;height:auto}

.tip{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--line);padding:7px 10px;font-size:13px;
  border-radius:6px;box-shadow:0 4px 14px rgba(31,42,55,.10);display:none;z-index:5;max-width:250px}
.tip b{font:600 13px var(--display)}

/* cloud */
.cloud{padding:30px 22px;text-align:center;line-height:1.2}
.cloud button{background:none;border:0;cursor:pointer;margin:3px 8px;font-family:var(--display);font-weight:600;padding:0;letter-spacing:-.3px}
.cloud button:hover{text-decoration:underline;text-underline-offset:4px}

/* log */
.day{padding:10px 18px;border-top:1px solid var(--line)}
.day:first-child{border-top:0}
.day h4{margin:6px 0 8px;font:600 13px var(--display);color:var(--muted)}
.ent{display:grid;grid-template-columns:72px 1fr auto;gap:10px;padding:5px 0;align-items:baseline}
.ent .t{color:var(--muted);font:500 14px var(--mono)}
.ent .p{font-size:12.5px;color:var(--faint)}
.ent button{color:var(--danger);font-size:13px}
.scroll{overflow-x:auto}
footer{margin-top:14px;font-size:13px;color:var(--muted)}
footer code{font:500 13px var(--mono);color:var(--text);background:var(--panel);border:1px solid var(--line);padding:1px 6px;border-radius:4px;white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---- auth ---- */
.auth-overlay{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;padding:20px;z-index:50}
.auth-overlay[hidden]{display:none}
.auth-card{width:100%;max-width:340px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:26px 24px;box-shadow:0 8px 30px rgba(31,42,55,.07)}
.auth-brand{display:flex;align-items:center;gap:10px}
.auth-card .word{font:800 24px/1 var(--display);color:var(--navy);letter-spacing:-.6px}
.auth-card .word i{font-style:normal;font-weight:300}
.auth-sub{margin:6px 0 20px;color:var(--muted);font-size:13px}
.auth-card label{display:block;font:600 12px var(--display);color:var(--muted);margin:12px 0 5px;text-transform:uppercase;letter-spacing:.4px}
.auth-card input{width:100%;font:400 16px var(--body);color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:11px 12px}
.auth-card input:focus{outline:none;border-color:var(--link)}
.auth-btn{width:100%;margin-top:18px;border:0;background:var(--navy);color:#fff;font:600 15px var(--display);padding:12px;border-radius:7px;cursor:pointer}
.auth-btn:hover{background:#264b73}
.auth-btn:disabled{opacity:.6;cursor:default}
.auth-msg{min-height:18px;margin:12px 0 0;font-size:13px}
.auth-msg.err{color:var(--danger)}
.auth-msg.ok{color:var(--green)}
.auth-toggle{margin:16px 0 0;font-size:13px;color:var(--muted);text-align:center}
</style>
</head>
<body>
<div id="auth" class="auth-overlay" hidden>
  <form class="auth-card" id="authform" autocomplete="on">
    <div class="auth-brand"><span class="mark" aria-hidden="true">t</span><span class="word">daily<i>.tally</i></span></div>
    <p class="auth-sub">a log of the small things you do</p>
    <label for="auth-email">Email</label>
    <input id="auth-email" type="email" required autocomplete="email" inputmode="email">
    <label for="auth-pass">Password</label>
    <input id="auth-pass" type="password" required autocomplete="current-password" minlength="6">
    <button class="auth-btn" id="auth-go" type="submit">Sign in</button>
    <p class="auth-msg" id="auth-msg" role="status"></p>
    <p class="auth-toggle">
      <span id="auth-q">No account yet?</span>
      <button type="button" class="link" id="auth-switch">Create one</button>
    </p>
  </form>
</div>
<div class="wrap">
  <header>
    <span class="mark" aria-hidden="true">t</span>
    <span class="word">daily<i>.tally</i></span>
    <span class="tag">a log of the small things you do</span>
    <span class="spacer"></span>
    <span id="status">Connecting…</span>
    <button class="link" id="signout" style="display:none;margin-left:10px;font-family:var(--body)">Sign out</button>
  </header>

  <section class="hero">
    <h1>Log what you just did.</h1>
    <form class="entry" id="form" autocomplete="off">
      <input id="text" type="text" placeholder="drank 1 glass water" aria-label="What did you do?" enterkeyhint="done">
      <button class="hbtn" id="mic" type="button" aria-label="Speak an entry">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
      </button>
      <button class="hbtn" type="submit">Log</button>
    </form>
    <div id="feedback" aria-live="polite"></div>
  </section>

  <div class="toolbar">
    <nav class="strip" id="views" aria-label="Views"></nav>
    <nav class="strip time" id="times" aria-label="Time range"></nav>
    <div class="searchrow"><label for="search">Search</label><input id="search" type="search" placeholder="water, code, coffee…"></div>
  </div>
  <main id="view"></main>
  <div class="tip" id="tip"></div>
  <footer>Type or say things like <code>coded 30 min</code> <code>smoked</code> <code>ate oatmeal with berries</code> <code>drank 2 cups coffee</code></footer>
</div>

<script>
/* ---------- parsing ---------- */
const NUM_WORDS={zero:0,a:1,an:1,one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10,eleven:11,twelve:12,
  fifteen:15,twenty:20,thirty:30,forty:40,fortyfive:45,fifty:50,sixty:60,ninety:90,half:0.5,couple:2};
const UNITS={glass:'glass',glasses:'glass',cup:'cup',cups:'cup',bottle:'bottle',bottles:'bottle',can:'can',cans:'can',
  shot:'shot',shots:'shot',oz:'oz',ounce:'oz',ounces:'oz',ml:'ml',l:'l',liter:'l',liters:'l',litre:'l',litres:'l',
  min:'min',mins:'min',minute:'min',minutes:'min',m:'min',hr:'hr',hrs:'hr',hour:'hr',hours:'hr',h:'hr',
  page:'page',pages:'page',rep:'rep',reps:'rep',step:'step',steps:'step',mile:'mi',miles:'mi',mi:'mi',km:'km',
  lb:'lb',lbs:'lb',pound:'lb',pounds:'lb',kg:'kg',serving:'serving',servings:'serving',piece:'piece',pieces:'piece',slice:'slice',slices:'slice'};
const PLURAL={glass:'glasses',cup:'cups',bottle:'bottles',can:'cans',shot:'shots',page:'pages',rep:'reps',step:'steps',
  serving:'servings',piece:'pieces',slice:'slices'};
const COUNTABLE=new Set(['','glass','cup','bottle','can','shot','serving','piece','slice']);
const VERBS={drank:'drink',drinking:'drink',drinks:'drink',ate:'eat',eating:'eat',eats:'eat',smoked:'smoke',smoking:'smoke',
  coded:'code',coding:'code',wrote:'write',writing:'write',written:'write',slept:'sleep',sleeping:'sleep',walked:'walk',walking:'walk',
  ran:'run',running:'run',read:'read',reading:'read',watched:'watch',watching:'watch',felt:'feel',feeling:'feel',took:'take',
  went:'go',did:'do',made:'make',meditated:'meditate',worked:'work',working:'work',played:'play',playing:'play',
  cleaned:'clean',called:'call',studied:'study',vaped:'vape',biked:'bike',swam:'swim',weighed:'weigh',lifted:'lift',
  stretched:'stretch',cooked:'cook',practiced:'practice',journaled:'journal',showered:'shower',napped:'nap'};
const DESCRIBE=new Set(['eat','watch','read','feel','listen','play','meet','talk','call','cook','dream']);
const FILLER=new Set(['of','some','the','a','an','for','my','about','approximately','around','like']);
const PROSE=new Set(['i','im',"i'm",'just','had','so','today','and','then','we','my','the','this','um','uh','okay','ok','also','yesterday','got','have','been']);

function sing(w){return w.length>3&&/s$/.test(w)&&!/ss$/.test(w)?w.replace(/ies$/,'y').replace(/s$/,''):w}
function canonVerb(v){v=v.toLowerCase();return VERBS[v]||v}

function localParse(raw){
  const words=raw.toLowerCase().replace(/[^\w\s.'-]/g,' ').split(/\s+/).filter(Boolean);
  if(!words.length) return null;
  const verb=canonVerb(words[0]);
  let amount=null,unit='',rest=[];
  for(let i=1;i<words.length;i++){
    const w=words[i];
    let n=null;
    const m=w.match(/^(\d+(?:\.\d+)?)([a-z]+)?$/);
    if(amount===null&&m){n=parseFloat(m[1]);if(m[2]&&UNITS[m[2]]){amount=n;unit=UNITS[m[2]];continue}}
    else if(amount===null&&w in NUM_WORDS&&!(w==='a'||w==='an')||(amount===null&&(w==='a'||w==='an')&&words[i+1]&&UNITS[words[i+1]])) n=NUM_WORDS[w];
    if(n!==null&&amount===null){
      amount=n;
      if(words[i+1]&&UNITS[words[i+1]]){unit=UNITS[words[i+1]];i++}
      continue;
    }
    if(!FILLER.has(w)) rest.push(w);
  }
  if(unit==='hr'){amount=amount*60;unit='min'}
  let item=rest.join(' '),note='';
  if(DESCRIBE.has(verb)||rest.length>2){note=item;item=''}
  else item=rest.map(sing).join(' ');
  return {verb,item,note,amount:amount===null?1:amount,unit,explicit:amount!==null};
}
function looksStructured(raw){
  const w=raw.trim().toLowerCase().split(/\s+/);
  return w.length<=7&&!PROSE.has(w[0])&&!/\band\b|,|\bthen\b/.test(raw.toLowerCase());
}
const key=e=>e.verb+(e.item?' '+e.item:'');

/* ---------- config: paste your Supabase project values here ---------- */
const SUPABASE_URL  = "https://yxwaargjjwtupfiyhoyh.supabase.co";   // e.g. https://abcdxyz.supabase.co
const SUPABASE_ANON = "sb_publishable_CEDy_ThhowVqrjq-0dt6Og_Ku2yMLwz";  // the "anon public" key
const CONFIGURED = SUPABASE_URL.indexOf("http")===0 && SUPABASE_ANON.length>20;
let sb = null;
if(CONFIGURED && window.supabase){ sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON); }

/* ---------- storage: Supabase with local fallback ---------- */
const Store={entries:[],mode:'memory',uid:null,channel:null,listeners:[],
  emit(){this.listeners.forEach(f=>f())},

  async init(uid){
    this.uid = uid || null;
    if(sb && this.uid){
      try{
        const {data,error} = await sb.from('entries').select('*').order('ts',{ascending:false}).limit(5000);
        if(error) throw error;
        this.entries = data.map(fromRow);
        this.mode='db';
        setStatus(this.entries.length+' entries · saved to your account');
        this.emit();
        // live updates across devices
        this.channel = sb.channel('entries-'+this.uid)
          .on('postgres_changes',{event:'*',schema:'public',table:'entries'},()=>this.refresh())
          .subscribe();
        return;
      }catch(e){ console.warn('Supabase load failed, using local:',e.message||e); }
    }
    // fallback: this browser only
    this.mode='local';
    try{this.entries=JSON.parse(localStorage.getItem('tally')||'[]')}catch(e){this.entries=[]}
    setStatus(this.entries.length+' entries · saved in this browser');
    this.emit();
  },

  async refresh(){
    if(this.mode!=='db') return;
    const {data,error} = await sb.from('entries').select('*').order('ts',{ascending:false}).limit(5000);
    if(error) return;
    this.entries = data.map(fromRow);
    setStatus(this.entries.length+' entries · saved to your account');
    this.emit();
  },

  saveLocal(){try{localStorage.setItem('tally',JSON.stringify(this.entries))}catch(e){}},

  async add(e){
    if(this.mode==='db'){
      const {data,error} = await sb.from('entries').insert(toRow(e,this.uid)).select().single();
      if(error) throw error;
      const row = fromRow(data);
      this.entries.unshift(row); this.entries.sort((a,b)=>b.ts-a.ts); this.emit();
      return row.id;
    }
    const id='l'+Date.now()+Math.random().toString(36).slice(2,6);
    this.entries.unshift({id,...e});this.entries.sort((a,b)=>b.ts-a.ts);this.saveLocal();this.emit();return id;
  },

  async remove(id){
    if(this.mode==='db'){
      const {error} = await sb.from('entries').delete().eq('id',id);
      if(error) throw error;
      // db ids are numbers; ids read from data-del attributes are strings
      this.entries=this.entries.filter(e=>String(e.id)!==String(id)); this.emit(); return;
    }
    this.entries=this.entries.filter(e=>e.id!==id);this.saveLocal();this.emit();
  },

  reset(){ if(this.channel){sb.removeChannel(this.channel);this.channel=null;} this.entries=[];this.uid=null;this.mode='memory'; }
};

// map between app entry objects and db rows
function toRow(e,uid){return {user_id:uid,verb:e.verb,item:e.item||null,note:e.note||null,
  amount:(e.amount==null?null:e.amount),unit:e.unit||null,ts:Math.round(e.ts),txt:e.text||null,src:e.src||null};}
function fromRow(r){return {id:r.id,verb:r.verb,item:r.item||'',note:r.note||'',
  amount:(r.amount==null?null:+r.amount),unit:r.unit||'',ts:+r.ts,text:r.txt||'',src:r.src||''};}

function setStatus(t){document.getElementById('status').textContent=t}

/* ---------- Claude parsing for speech / prose ---------- */
let samplePromise=null;
function getSample(){if(!samplePromise)samplePromise=window.claude?claude.use('sample').catch(()=>null):Promise.resolve(null);return samplePromise}
async function claudeParse(raw){
  const sample=await getSample(); if(!sample) return null;
  const known=[...new Set(Store.entries.map(key))].slice(0,60);
  const prompt=`Turn this personal activity log message into structured entries.
Message: "${raw.replace(/"/g,"'")}"
Current local time: ${new Date().toString()}
Existing trackers (reuse these exact verb/item pairs when they match): ${known.join('; ')||'none yet'}

Return ONLY a JSON array, no prose. Each element:
{"verb": base-form verb, one lowercase word (drink, eat, smoke, code, write, sleep, walk, feel...),
 "item": short singular lowercase noun naming WHAT is counted, e.g. "water", "coffee", "cigarette"; "" if none,
 "note": free description (meal contents, show title, mood detail) or "",
 "amount": number (default 1),
 "unit": one of glass, cup, bottle, can, shot, oz, ml, l, min, page, rep, step, mi, km, lb, kg, serving, piece, slice, or "" for plain counts,
 "minutesAgo": how long ago it happened (0 if now)}
Rules: one element per distinct activity. Convert hours to min. For eat, watch, read, feel, listen, play, meet, call: put the description in note and leave item "". Ignore filler words like um, uh, just, I.`;
  try{
    const out=await sample.json(prompt,{modelTier:'quick'});
    if(!Array.isArray(out)) return null;
    return out.filter(o=>o&&o.verb).map(o=>{
      let amount=Number(o.amount)||1,unit=UNITS[o.unit]||o.unit||'';
      if(unit==='hr'){amount*=60;unit='min'}
      return {verb:canonVerb(String(o.verb).split(/\s/)[0]),item:sing(String(o.item||'').toLowerCase().trim()),
        note:String(o.note||''),amount,unit,minutesAgo:Math.max(0,Number(o.minutesAgo)||0)};
    });
  }catch(e){
    if(e&&e.code==='not_granted') samplePromise=Promise.resolve(null);
    return null;
  }
}

/* ---------- submit ---------- */
const fb=document.getElementById('feedback');
let lastBatch=[];
async function submit(raw,src){
  raw=raw.trim(); if(!raw) return;
  let parsed=null;
  if(!looksStructured(raw)){fb.textContent='Reading that…';parsed=await claudeParse(raw)}
  if(!parsed||!parsed.length){const p=localParse(raw);parsed=p?[p]:[]}
  if(!parsed.length){fb.textContent='Nothing to log. Start with what you did, like “drank 1 glass water”.';return}
  const now=Date.now();
  lastBatch=[];
  for(const p of parsed){
    const e={verb:p.verb,item:p.item||'',note:p.note||'',amount:p.amount,unit:p.unit||'',
      ts:now-(p.minutesAgo||0)*60000,text:raw,src};
    try{lastBatch.push(await Store.add(e))}catch(err){fb.textContent='Could not save: '+(err.code||err.message);return}
  }
  fb.innerHTML='Logged '+parsed.map(p=>`<span class="chip">${esc(key(p))} · ${esc(fmtAmt(p.amount,p.unit))}${p.note?' · '+esc(p.note):''}</span>`).join('')+
    ` <button class="link" id="undo">Undo</button>`;
  document.getElementById('undo').onclick=async()=>{for(const id of lastBatch)await Store.remove(id);fb.textContent='Removed.';lastBatch=[]};
}

/* ---------- state & helpers ---------- */
const S={view:'today',scope:'day',anchor:new Date(),q:''};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fmtAmt(a,u){
  a=Math.round(a*100)/100;
  if(u==='min'){if(a>=60){const h=Math.floor(a/60),m=Math.round(a%60);return h+'h'+(m?' '+m+'m':'')}return a+' min'}
  if(!u) return '×'+a;
  return a+' '+(a===1?u:(PLURAL[u]||u));
}
const dayStart=d=>{const x=new Date(d);x.setHours(0,0,0,0);return x};
function windowOf(){
  const a=dayStart(S.anchor);let s,e;
  if(S.scope==='day'){s=a;e=d3.timeDay.offset(a,1)}
  else if(S.scope==='week'){s=d3.timeWeek.floor(a);e=d3.timeWeek.offset(s,1)}
  else if(S.scope==='month'){s=d3.timeMonth.floor(a);e=d3.timeMonth.offset(s,1)}
  else{s=d3.timeYear.floor(a);e=d3.timeYear.offset(s,1)}
  return [s,e];
}
function inWindow(){
  const [s,e]=windowOf();
  return Store.entries.filter(x=>x.ts>=+s&&x.ts<+e&&match(x));
}
function match(x){if(!S.q)return true;const q=S.q.toLowerCase();return key(x).includes(q)||(x.note||'').toLowerCase().includes(q)}
/* how much an entry "weighs" when trackers with different units share one chart */
const weight=x=>COUNTABLE.has(x.unit)?x.amount:1;
function aggregate(list){
  const m=new Map();
  for(const x of list){
    const k=key(x);if(!m.has(k))m.set(k,{key:k,units:new Map(),n:0,w:0,notes:[]});
    const g=m.get(k);g.n++;g.w+=weight(x);g.units.set(x.unit,(g.units.get(x.unit)||0)+x.amount);
    if(x.note)g.notes.push(x.note);
  }
  return [...m.values()].sort((a,b)=>b.w-a.w);
}
const totalStr=g=>[...g.units].map(([u,a])=>fmtAmt(a,u)).join(' + ');
function ramp(){const cs=getComputedStyle(document.documentElement);
  return d3.interpolateRgb(cs.getPropertyValue('--ramp-lo').trim(),cs.getPropertyValue('--ramp-hi').trim())}
const tip=document.getElementById('tip');
function showTip(ev,html){
  const host=document.querySelector('.wrap').getBoundingClientRect();
  tip.innerHTML=html;tip.style.display='block';
  let x=ev.clientX-host.left+12,y=ev.clientY-host.top+12;
  const w=tip.offsetWidth;if(x+w>host.width)x=Math.max(4,x-w-24);
  tip.style.left=x+'px';tip.style.top=y+'px';
}
const hideTip=()=>tip.style.display='none';

const view=document.getElementById('view');
function emptyMsg(){

    ?`<div class="empty">Nothing logged ${S.q?'matching “'+esc(S.q)+'” ':''}in this range.</div>`
    :`<div class="empty"><strong>Your log is empty.</strong><br>Type or say what you just did above. Totals build up here as you go.</div>`;
}

function vToday(){
  const list=inWindow();if(!list.length)return view.innerHTML=emptyMsg();
  const groups=aggregate(list);
  const end=d3.timeDay.offset(windowOf()[1],0),start=d3.timeDay.offset(end,-14);
  view.innerHTML='<div class="rows">'+groups.map((g,i)=>`<div class="row"><div><div class="name">${esc(g.key)}</div>${
    g.notes.length?`<div class="notes">${esc(g.notes.slice(-4).join(' · '))}</div>`:''}</div>
    <div class="total">${esc(totalStr(g))}</div><div class="spark" data-i="${i}"></div></div>`).join('')+'</div>';
  const r=ramp();
  view.querySelectorAll('.spark').forEach(el=>{
    const g=groups[+el.dataset.i];
    const days=d3.timeDay.range(start,end);
    const vals=days.map(d=>d3.sum(Store.entries.filter(x=>key(x)===g.key&&x.ts>=+d&&x.ts<+d3.timeDay.offset(d,1)),weight));
    const mx=d3.max(vals)||1,w=120,h=26,bw=w/days.length;
    const svg=d3.select(el).append('svg').attr('width',w).attr('height',h).attr('role','img').attr('aria-label','Last 14 days');
    svg.selectAll('rect').data(vals).join('rect').attr('x',(d,i)=>i*bw+.5).attr('width',bw-1)
      .attr('y',d=>h-Math.max(1,d/mx*h)).attr('height',d=>Math.max(1,d/mx*h)).attr('fill',d=>d?r(.35+.65*d/mx):r(.08));
  });
}

function vCalendar(){
  const list=inWindow();if(!list.length)return view.innerHTML=emptyMsg();
  const groups=aggregate(list).slice(0,12);const r=ramp();
  const [ws,we]=windowOf();
  const monthMode=S.scope!=='year';
  const ms=monthMode?d3.timeMonth.floor(ws):ws, me=monthMode?d3.timeMonth.offset(ms,1):we;
  view.innerHTML='<div class="cals"></div>';const host=view.querySelector('.cals');
  if(!monthMode)host.style.gridTemplateColumns='1fr';

    const mx=d3.max([...byDay.values()],d=>d.w)||1;

      cell=24;const rows=d3.timeWeek.count(ms,d3.timeDay.offset(me,-1))+1;

        .attr('fill',d=>{const v=byDay.get(+d);return v?r(.3+.7*v.w/mx):r(.06)});
      svg.selectAll('text').data(days).join('text').attr('x',d=>d.getDay()*cell+4).attr('y',d=>d3.timeWeek.count(ms,d)*cell+11)

      svg.selectAll('rect').data(days).join('rect')

        .attr('fill',d=>{const v=byDay.get(+d);return v?r(.3+.7*v.w/mx):r(.06)});

      showTip(ev,`<b>${d3.timeFormat('%a %b %-d')(d)}</b><br>${v?esc(totalStr(aggregate(v.list)[0])):'nothing logged'}`)}).on('pointerleave',hideTip);
  }

function vSeries(){
  const list=inWindow();if(!list.length)return view.innerHTML=emptyMsg();
  const [s,e]=windowOf();
  const hourly=S.scope==='day';
  const interval=hourly?d3.timeHour:(S.scope==='year'?d3.timeWeek:d3.timeDay);
  const bins=interval.range(interval.floor(s),e);
  const groups=aggregate(list);const top=groups.slice(0,9).map(g=>g.key);
  const keys=groups.length>9?[...top,'other']:top;
  const rows=bins.map(b=>{const o={t:b};keys.forEach(k=>o[k]=0);return o});
  const binNums=bins.map(Number);
  const idx=t=>Math.min(bins.length-1,Math.max(0,d3.bisectRight(binNums,t)-1));
  for(const x of list){const k=top.includes(key(x))?key(x):'other';rows[idx(x.ts)][k]+=weight(x)}
  const W=view.clientWidth||600,H=Math.max(300,Math.min(420,W*.55)),m={t:16,r:12,b:26,l:12};
  const stack=d3.stack().keys(keys).offset(d3.stackOffsetWiggle).order(d3.stackOrderInsideOut)(rows);
  const x=d3.scaleTime().domain([bins[0],bins[bins.length-1]]).range([m.l,W-m.r]);
  const y=d3.scaleLinear().domain([d3.min(stack,l=>d3.min(l,d=>d[0])),d3.max(stack,l=>d3.max(l,d=>d[1]))]).range([H-m.b,m.t]);
  const r=ramp();const color=k=>k==='other'?r(.12):r(.25+.75*(1-keys.indexOf(k)/Math.max(1,keys.length-1)));
  view.innerHTML='';
  const svg=d3.select(view).append('svg').attr('width',W).attr('height',H).attr('role','img').attr('aria-label','Stacked time series');
  const area=d3.area().x(d=>x(d.data.t)).y0(d=>y(d[0])).y1(d=>y(d[1])).curve(d3.curveBasis);
  svg.selectAll('path').data(stack).join('path').attr('d',area).attr('fill',d=>color(d.key)).attr('stroke','var(--panel)').attr('stroke-width',.6)
    .on('pointermove',(ev,d)=>{const t=x.invert(d3.pointer(ev)[0]);const i=idx(+t);
      const items=list.filter(e0=>(d.key==='other'?!top.includes(key(e0)):key(e0)===d.key)&&+bins[i]<=e0.ts&&e0.ts<+interval.offset(bins[i],1));
      showTip(ev,`<b>${esc(d.key)}</b><br>${(hourly?d3.timeFormat('%-I %p'):d3.timeFormat('%b %-d'))(bins[i])}: ${items.length?esc(aggregate(items).map(totalStr).join(', ')):'none'}`)})
    .on('pointerleave',hideTip);
  svg.selectAll('text.lab').data(stack.filter(l=>l.key!=='other')).join('text').attr('class','lab').each(function(l){
    let best=0,bi=0;l.forEach((d,i)=>{if(d[1]-d[0]>best){best=d[1]-d[0];bi=i}});
    if(y(l[bi][0])-y(l[bi][1])<13)return;
    d3.select(this).attr('x',Math.min(W-60,Math.max(30,x(l[bi].data.t)))).attr('y',(y(l[bi][0])+y(l[bi][1]))/2+4)
      .attr('text-anchor','middle').attr('font-size',11).attr('fill','var(--cell-ink)').attr('pointer-events','none').text(l.key)});
  svg.append('g').attr('transform',`translate(0,${H-m.b+4})`).call(d3.axisBottom(x).ticks(Math.max(3,W/110)).tickSize(0)
    .tickFormat(hourly?d3.timeFormat('%-I%p'):(S.scope==='year'?d3.timeFormat('%b'):d3.timeFormat('%b %-d'))))
    .call(g=>g.select('.domain').remove()).selectAll('text').attr('fill','var(--muted)').attr('font-size',12);
}

function vTreemap(){

  const groups=aggregate(list);const W=view.clientWidth||600,H=Math.max(320,Math.min(460,W*.6));
  const root=d3.hierarchy({children:groups}).sum(d=>d.w||0).sort((a,b)=>b.value-a.value);

    .attr('text-anchor','middle').attr('font-size',12).attr('font-weight',500).attr('pointer-events','none')

function vCloud(){
  const list=inWindow();if(!list.length)return view.innerHTML=emptyMsg();
  const counts=new Map();
  for(const x of list){
    const add=(w,n)=>{if(w.length<3||FILLER.has(w))return;counts.set(w,(counts.get(w)||0)+n)};
    add(x.verb,weight(x));if(x.item)add(x.item,weight(x));
    (x.note||'').toLowerCase().split(/[^a-z']+/).forEach(w=>add(w,1));
  }
  const words=[...counts].sort((a,b)=>b[1]-a[1]).slice(0,70);const mx=words[0][1],r=ramp();
  const shuffled=words.map((w,i)=>[w,(i*7919)%97]).sort((a,b)=>a[1]-b[1]).map(a=>a[0]);
  view.innerHTML='<div class="cloud">'+shuffled.map(([w,c])=>{const t=Math.sqrt(c/mx);
    return `<button data-w="${esc(w)}" style="font-size:${(13+33*t).toFixed(0)}px;color:${r(.35+.65*t)}">${esc(w)}</button>`}).join(' ')+'</div>';
  view.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>{S.q=b.dataset.w;document.getElementById('search').value=S.q;S.view='today';render()});

      ${x.text&&x.text.toLowerCase()!==key(x)?`<div class="p">“${esc(x.text)}”</div>`:''}</span>

/* ---------- auth gate ---------- */
const authEl=document.getElementById('auth');
const authForm=document.getElementById('authform');
const emailEl=document.getElementById('auth-email');
const passEl=document.getElementById('auth-pass');
const goEl=document.getElementById('auth-go');
const msgEl=document.getElementById('auth-msg');
const switchEl=document.getElementById('auth-switch');
const qEl=document.getElementById('auth-q');
const signoutEl=document.getElementById('signout');
let authMode='signin';

function setAuthMsg(t,kind){msgEl.textContent=t||'';msgEl.className='auth-msg'+(kind?' '+kind:'');}
function showAuth(){authEl.hidden=false;}
function hideAuth(){authEl.hidden=true;}

switchEl.onclick=()=>{
  authMode = authMode==='signin'?'signup':'signin';
  goEl.textContent = authMode==='signin'?'Sign in':'Create account';
  qEl.textContent   = authMode==='signin'?'No account yet?':'Already have one?';
  switchEl.textContent = authMode==='signin'?'Create one':'Sign in';
  passEl.setAttribute('autocomplete', authMode==='signin'?'current-password':'new-password');
  setAuthMsg('');
};

authForm.onsubmit=async(ev)=>{
  ev.preventDefault();
  if(!sb){setAuthMsg('App is not configured with Supabase keys yet.','err');return;}
  goEl.disabled=true;setAuthMsg(authMode==='signup'?'Creating account…':'Signing in…');
  const email=emailEl.value.trim(), password=passEl.value;
  try{
    if(authMode==='signup'){
      const {data,error}=await sb.auth.signUp({email,password});
      if(error)throw error;
      if(!data.session){setAuthMsg('Account made. Check your email to confirm, then sign in.','ok');
        authMode='signin';goEl.textContent='Sign in';goEl.disabled=false;return;}
    }else{
      const res=await Promise.race([sb.auth.signInWithPassword({email,password}),
        new Promise((_,rej)=>setTimeout(()=>rej(new Error('Sign-in timed out. Check your connection and try again.')),15000))]);
      if(res.error)throw res.error;
    }
  }catch(e){setAuthMsg(e.message||'Something went wrong.','err');goEl.disabled=false;}
};

signoutEl.onclick=async()=>{ if(sb){await sb.auth.signOut();} };

async function boot(){
  if(!CONFIGURED || !sb){
    // no backend configured — run local-only so the app still works
    hideAuth(); signoutEl.style.display='none';
    render(); await Store.init(null); return;
  }
  // react to login/logout
  // Callback must stay synchronous: awaiting Supabase calls inside it deadlocks the auth lock.
  let curUid=null;
  sb.auth.onAuthStateChange((_evt,session)=>{
    const uid=session&&session.user?session.user.id:null;
    setTimeout(()=>{
      if(uid){
        hideAuth(); signoutEl.style.display=''; goEl.disabled=false; passEl.value=''; setAuthMsg('');
        if(uid!==curUid){curUid=uid; Store.reset(); render(); Store.init(uid);}
      }else{
        curUid=null; signoutEl.style.display='none';
        Store.reset(); render(); setStatus(''); showAuth();
      }
    },0);
  });
  render();
  const {data}=await sb.auth.getSession();
  if(!(data.session&&data.session.user)) showAuth();
}
boot();
</script>
</body>
</html>
